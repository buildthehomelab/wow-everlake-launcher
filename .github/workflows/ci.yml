name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: build for the supported platforms
        if: runner.os == 'Linux'
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/everlake-launcher
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/everlake-launcher
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/everlake-launcher
